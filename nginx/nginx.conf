worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # File upload limit (Allows up to 25MB for medical reports / profile images)
    client_max_body_size 25M;

    # Gzip Compression for fast responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone (Protects against Brute-force & DDoS)
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

    # Upstream Backend Cluster (Docker DNS automatically load balances across scaled api replicas)
    upstream backend_cluster {
        least_conn; # Distribute traffic to the server with least active connections
        server api:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Main API & Application Proxy
        location / {
            limit_req zone=api_rate_limit burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # WebSocket & Long-Polling Headers (For WebSockets & WebRTC Signaling)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Real Client IP and Host Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout configurations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Stripe Webhook (No rate-limit throttling to ensure critical financial events are never dropped)
        location /webhook {
            proxy_pass http://backend_cluster/webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Dedicated Nginx Load Balancer Health Probe
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
